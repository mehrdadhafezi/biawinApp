name: Stage 5.16-E — Home Verification (API only)

# Manual only, same trust boundary as deploy-staging.yml — workflow_dispatch
# only, never on push. Runs the Stage 5.16-E authenticated, API-only fixture
# verification (docs/STAGE-5.16-E-CI-AUTHENTICATED-API-FIXTURE-VERIFICATION-
# RESULT.md) against the ALREADY-DEPLOYED staging backend. It does NOT
# deploy, does NOT restart the running backend/web/admin containers, and
# does NOT run Browser QA / Playwright / Puppeteer / authenticated-qa-
# runner.ts under any circumstance — see
# backend/scripts/staging-qa/stage-5-16-e-home-fixture-verifier.ts and
# deploy/staging/run-stage-5-16-e-verification.sh, which this workflow only
# invokes, never reimplements.
#
# Reuses the EXACT SAME 4 repository secrets deploy-staging.yml already
# requires — no new secret is created by this workflow:
#   STAGING_SSH_HOST / STAGING_SSH_PORT / STAGING_SSH_USER /
#   STAGING_SSH_PRIVATE_KEY
# ADMIN_SEED_EMAIL/ADMIN_SEED_PASSWORD are NOT GitHub secrets and are never
# referenced here — they already live only in the server's own
# deploy/staging/.env.staging (never committed) and reach the verifier
# script exclusively through the backend container's normal `env_file:`
# mechanism, entirely on the server side. This workflow never sees them.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — required secrets present
        run: |
          missing=0
          for v in STAGING_SSH_HOST STAGING_SSH_PORT STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing repository secret: $v"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Update server checkout (source tree only — does not restart any running container)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.STAGING_SSH_PORT }}" "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts
          ssh -p "${{ secrets.STAGING_SSH_PORT }}" "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "cd /srv/biawin-staging && git fetch origin main && git checkout main && git reset --hard origin/main && git rev-parse HEAD"

      - name: Run Stage 5.16-E verification (API-only fixture test, real HTTP against the running backend)
        run: |
          ssh -p "${{ secrets.STAGING_SSH_PORT }}" "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "cd /srv/biawin-staging && ./deploy/staging/run-stage-5-16-e-verification.sh"

      - name: Fetch sanitized report artifacts from the server
        if: always()
        run: |
          mkdir -p stage-5-16-e-artifacts
          scp -P "${{ secrets.STAGING_SSH_PORT }}" \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/tmp/stage-5-16-e/stage-5-16-e-report-*.txt" \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/tmp/stage-5-16-e/stage-5-16-e-report-*.json" \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/tmp/stage-5-16-e/stage-5.16-e-before.txt" \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/tmp/stage-5-16-e/stage-5.16-e-after.txt" \
            stage-5-16-e-artifacts/ || echo "::warning::some report files were not found — see the previous step's log"

      # The verifier's own redact() strips anything JWT-shaped and the
      # admin password before a report is ever written on the server — this
      # step uploads exactly what the server wrote, nothing is redacted a
      # second time here because there is nothing left to redact.
      - name: Upload sanitized verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-5-16-e-verification-report
          path: stage-5-16-e-artifacts/
          retention-days: 30
          if-no-files-found: warn
