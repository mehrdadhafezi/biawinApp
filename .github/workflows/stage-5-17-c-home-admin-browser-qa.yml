name: Stage 5.17-C — Home Admin Browser QA

# Manual only (workflow_dispatch) — never on push/PR/schedule. Runs the executable Home
# Admin Browser QA implemented in Stage 5.17-D (docs/STAGE-5.17-D-HOME-ADMIN-BROWSER-QA-
# IMPLEMENTATION-RESULT.md) against the ALREADY-DEPLOYED staging environment.
#
# It does NOT deploy, does NOT restart the running backend/web/admin containers, and does
# NOT invoke authenticated-qa-runner.ts / run-authenticated-qa.sh. It only calls
# deploy/staging/run-stage-5-17-c-browser-qa.sh on the server (setup -> baseline -> fixtures
# -> browser tests -> cleanup -> leftover check -> checksum AFTER -> Home baseline AFTER ->
# verdict; cleanup always runs). Exit code 0 only when every required test passed.
#
# Reuses the SAME 4 repository secrets as deploy-staging.yml (STAGING_SSH_HOST / _PORT /
# _USER / _PRIVATE_KEY). ADMIN_SEED_EMAIL/ADMIN_SEED_PASSWORD are NOT GitHub secrets: they
# stay in the server's own deploy/staging/.env.staging and never reach this workflow.
#
# Commit provenance (Stage 5.17-F): this job fails BEFORE running anything on staging if the
# server checkout it just updated is not at `github.sha` (the commit this workflow dispatched
# against). `github.sha` is also passed to the wrapper, which independently re-checks the same
# thing server-side (STAGE517C_WORKFLOW_SHA) and records it in the report.
#
# Run isolation (Stage 5.17-G): every execution writes to its OWN server directory,
# /tmp/stage-5-17-c/run-<run_id>-<run_attempt>/, created fresh by the wrapper (a plain mkdir that
# fails if it exists). This workflow fetches EXACTLY that path — never a shared/fixed one — into a
# brand-new local directory, and validates the artifact against THIS run's github.run_id/attempt and
# github.sha (deploy/staging/qa/validate-stage-5-17-c-artifact.js) before anything is uploaded. An
# artifact that does not provably belong to this execution is NOT uploaded as a result: an
# INVALID-ARTIFACT.txt explaining why is uploaded instead and the job fails.
on:
  workflow_dispatch:
    inputs:
      allow_reorder_metadata_touch:
        description: "Allow the UI reorder to send the whole list (touches real rows' updatedAt/updatedBy; ids/order/active/media are verified restored). Off => REO-02 is BLOCKED and the verdict cannot be PASS."
        type: boolean
        default: false
      provision_temporary_roles:
        description: "Create temporary SUPPORT_VIEWER + CONTENT_EDITOR admins for RBAC-01..04 (deleted at cleanup; audit rows remain). Off => RBAC tests are BLOCKED and the verdict cannot be PASS."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # One identity for this execution, used for the server directory, the wrapper, the fetch and the validation.
      RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Only to get the artifact validator that belongs to the dispatched commit (checkout is at github.sha).
      - name: Checkout (validator script only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Guard — required secrets present
        run: |
          missing=0
          for v in STAGING_SSH_HOST STAGING_SSH_PORT STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing repository secret: $v"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Update server checkout (source tree only — does not restart any running container)
        id: server_checkout
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.STAGING_SSH_PORT }}" "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts
          server_sha="$(ssh -p "${{ secrets.STAGING_SSH_PORT }}" "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "cd /srv/biawin-staging && git fetch origin main && git checkout main && git reset --hard origin/main && git rev-parse HEAD")"
          echo "sha=$server_sha" >> "$GITHUB_OUTPUT"

      - name: Guard — server checkout matches the dispatched commit
        run: |
          if [ "${{ steps.server_checkout.outputs.sha }}" != "${{ github.sha }}" ]; then
            echo "::error::PROVENANCE MISMATCH: workflow dispatched against ${{ github.sha }} but the server checkout is at ${{ steps.server_checkout.outputs.sha }} — refusing to run Browser QA."
            exit 1
          fi

      - name: Run Home Admin Browser QA (setup, browser tests, cleanup, verification)
        env:
          ALLOW_REORDER: ${{ inputs.allow_reorder_metadata_touch }}
          PROVISION_ROLES: ${{ inputs.provision_temporary_roles }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          # Only the literal strings 'true'/'false' are ever forwarded.
          reorder=false; [ "$ALLOW_REORDER" = "true" ] && reorder=true
          roles=false;   [ "$PROVISION_ROLES" = "true" ] && roles=true
          # `bash <script>` — never `./<script>`: the wrapper must not depend on the file's executable bit,
          # which `git reset --hard` on the server restores to whatever mode git tracks (it was 100644).
          ssh -p "${{ secrets.STAGING_SSH_PORT }}" "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "cd /srv/biawin-staging && STAGE517C_ALLOW_REORDER_METADATA_TOUCH=$reorder STAGE517C_PROVISION_ROLES=$roles STAGE517C_WORKFLOW_SHA=$WORKFLOW_SHA STAGE517C_WORKFLOW_RUN_ID=$RUN_TOKEN bash ./deploy/staging/run-stage-5-17-c-browser-qa.sh"

      # Exactly THIS run's directory. If the run step failed before creating it, this fails to copy
      # anything — which is the correct, honest outcome (see the validation step).
      - name: Fetch this run's artifact from the server
        if: always()
        run: |
          rm -rf stage-5-17-c-artifacts-raw stage-5-17-c-artifacts
          mkdir stage-5-17-c-artifacts-raw stage-5-17-c-artifacts
          scp -r -P "${{ secrets.STAGING_SSH_PORT }}" \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/tmp/stage-5-17-c/run-${RUN_TOKEN}/artifact/." \
            stage-5-17-c-artifacts-raw/ || echo "::warning::no artifact could be fetched from /tmp/stage-5-17-c/run-${RUN_TOKEN}/artifact (the wrapper did not get as far as creating it, or SSH/scp failed)"

      - name: Validate the artifact belongs to THIS run before upload
        if: always()
        run: |
          set +e
          if [ -z "$(ls -A stage-5-17-c-artifacts-raw 2>/dev/null)" ]; then
            {
              echo "Stage 5.17-C Home Admin Browser QA — CONTROLLED FAILURE REPORT"
              echo "Workflow run: ${RUN_TOKEN}   Commit: ${{ github.sha }}"
              echo "VERDICT: FAIL — no artifact was produced by THIS execution (nothing exists at /tmp/stage-5-17-c/run-${RUN_TOKEN}/artifact on the server)."
              echo "Nothing from any other run was substituted. Tests: not evaluated. Cleanup/leftover status: UNKNOWN — inspect /tmp/stage-5-17-c/run-${RUN_TOKEN} on the server before trusting staging data."
              echo "Stage 5.17 is NOT closed by this run."
            } > stage-5-17-c-artifacts/CONTROLLED-FAILURE.txt
            echo "::error::no artifact from this execution"
            exit 1
          fi
          node deploy/staging/qa/validate-stage-5-17-c-artifact.js stage-5-17-c-artifacts-raw \
            --workflow-sha "${{ github.sha }}" --workflow-run-id "${RUN_TOKEN}" > validation-result.json
          status=$?
          cat validation-result.json
          if [ "$status" -eq 0 ]; then
            cp -r stage-5-17-c-artifacts-raw/. stage-5-17-c-artifacts/
            echo "artifact validated for workflow run ${RUN_TOKEN} at ${{ github.sha }}"
            exit 0
          fi
          # NOT uploaded as a result: only the reasons are.
          {
            echo "INVALID ARTIFACT — this is NOT the result of workflow run ${RUN_TOKEN} (commit ${{ github.sha }})."
            echo "The files fetched for this run failed validation and were NOT uploaded:"
            cat validation-result.json
          } > stage-5-17-c-artifacts/INVALID-ARTIFACT.txt
          echo "::error::artifact failed run-isolation validation — see INVALID-ARTIFACT.txt"
          exit 1

      # Everything uploaded was redacted on the server (JWTs, bearer tokens, the admin password,
      # DB URLs) and validated above. state.json / roles.json / raw snapshots are never copied.
      - name: Upload sanitized Browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-5-17-c-home-admin-browser-qa-report
          path: stage-5-17-c-artifacts/
          retention-days: 30
          if-no-files-found: warn
