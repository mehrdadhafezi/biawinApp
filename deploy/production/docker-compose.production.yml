name: biawin-production

# Structurally identical to deploy/staging/docker-compose.staging.yml on
# purpose (docs/10-release-process.md "Production promotion" always sketched
# it this way) — same services, same build files (deploy/production/
# Dockerfile.*, duplicated from staging's rather than shared, so the two
# environments can evolve independently without one accidentally changing
# the other), same migrate/seed/media-migration commands. Only domain names,
# ports, the compose project name, and the Docker subnet differ.
#
# PENDING SERVER DISCOVERY (Stage P.1 preflight — see
# docs/production-deployment-home-cms.md "Open questions"): the exact host
# this deploys to is not yet confirmed. The port numbers and subnet below
# are PROPOSED defaults, not verified-safe — if production shares the same
# physical host as staging (62.204.61.18), they must first be checked
# against what's already occupied there (staging's own 3001/3002/4001/
# 5433/6380/9010/9011, the host's pre-existing 3000/5432/8080, and
# 172.19.0.0/16). If production is a separate, dedicated host, these values
# are almost certainly fine as-is, but should still be confirmed once that
# host is known — do not treat this file as final until that's resolved.
#
# Known-occupied ports if colocated with staging (DO NOT reuse): 3000, 3001,
# 3002, 4001, 5432, 5433, 6380, 8080, 9010, 9011.
# Proposed production ports (unverified — see above): 3101 (web),
# 3102 (admin), 4101 (backend), 5533 (postgres), 6480 (redis),
# 9110/9111 (minio).
#
# Proposed subnet (unverified): 172.20.0.0/16 — must be added to the host's
# CSF/Imunify360 allow-rule (/etc/csf/csfpost.sh) alongside staging's
# existing 172.19.0.0/16 rule if colocated; see
# docs/08-staging-deployment.md "Firewall" for the exact pattern to mirror.

services:
  postgres:
    image: postgres:16-alpine
    container_name: biawin-production-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biawin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-biawin_production}
    ports:
      - "127.0.0.1:5533:5432"
    volumes:
      - biawin_production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biawin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: biawin-production-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6480:6379"
    volumes:
      - biawin_production_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: biawin-production-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-biawin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9110:9000"
      - "127.0.0.1:9111:9001"
    volumes:
      - biawin_production_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: biawin-production-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-biawin} ${MINIO_ROOT_PASSWORD:?} &&
      mc mb -p local/${STORAGE_BUCKET:-biawin-production} &&
      mc anonymous set download local/${STORAGE_BUCKET:-biawin-production}
      "

  backend:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.backend
    image: biawin-production-backend:latest
    container_name: biawin-production-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Single source of truth for the MinIO/S3 credentials — see
      # docker-compose.staging.yml's identical block for the full incident
      # this prevents (SignatureDoesNotMatch from two independently-typed
      # secrets drifting apart). Applied here from day one, not discovered
      # the hard way as it was on staging.
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-biawin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:4101:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    image: biawin-production-web:latest
    container_name: biawin-production-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3000"
    depends_on:
      - backend

  admin:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.admin
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:?NEXT_PUBLIC_ADMIN_API_URL is required}
    image: biawin-production-admin:latest
    container_name: biawin-production-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:3000"
    depends_on:
      - backend

volumes:
  biawin_production_postgres_data:
    name: biawin_production_postgres_data
  biawin_production_redis_data:
    name: biawin_production_redis_data
  biawin_production_minio_data:
    name: biawin_production_minio_data

networks:
  default:
    name: biawin-production_default
    ipam:
      config:
        - subnet: 172.20.0.0/16
