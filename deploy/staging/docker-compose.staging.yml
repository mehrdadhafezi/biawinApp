name: biawin-staging

# Fully independent namespace on a shared server — no port, volume, network,
# or container name here may collide with other projects (Beauty Platform /
# Romina) already running on this host. Every host bind is loopback-only;
# LiteSpeed reverse-proxies staging.biawin.ir / api-staging.biawin.ir /
# admin-staging.biawin.ir to 127.0.0.1:3001 / 127.0.0.1:4001 / 127.0.0.1:3002
# (see docs/08-staging-deployment.md). `admin-staging.biawin.ir` and the
# `admin` service below are new as of Stage 5.22 — the vhost/DNS/SSL steps
# for it are a manual one-time addition, not yet done as of this commit
# (docs/10-release-process.md "One-time server setup, Stage 5.22 addendum").
#
# Known-occupied ports on this host (DO NOT reuse): 5432, 8080, 3000.
# Biawin staging uses: 3001 (web), 3002 (admin), 4001 (backend),
# 5433 (postgres), 6380 (redis), 9010/9011 (minio).
#
# The default network's subnet is pinned below to 172.19.0.0/16 — the host's
# CSF/Imunify360 firewall has an explicit /etc/csf/csfpost.sh allow-rule
# scoped to exactly this subnet + ports 3000/4000 (see docs/08-staging-deployment.md
# "Firewall"). If this subnet is ever allowed to float (e.g. after `docker
# network rm` + recreate without this pin), Docker may assign a different
# subnet and silently break external reachability of the published ports
# again, with no error from Compose itself.

services:
  postgres:
    image: postgres:16-alpine
    container_name: biawin-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biawin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-biawin_staging}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - biawin_staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biawin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: biawin-staging-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - biawin_staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: biawin-staging-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-biawin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - biawin_staging_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: biawin-staging-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-biawin} ${MINIO_ROOT_PASSWORD:?} &&
      mc mb -p local/${STORAGE_BUCKET:-biawin-staging} &&
      mc anonymous set download local/${STORAGE_BUCKET:-biawin-staging}
      "

  backend:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.backend
    image: biawin-staging-backend:latest
    container_name: biawin-staging-backend
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      # Single source of truth for the MinIO/S3 credentials the backend
      # authenticates with — deliberately NOT read from .env.staging's own
      # STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY keys (env_file above still
      # supplies every other variable; Compose's `environment:` always wins
      # over `env_file:` for a key present in both, which is exactly what
      # makes this override effective). This bit real staging (Stage 5.22):
      # .env.staging.example had STORAGE_SECRET_KEY and MINIO_ROOT_PASSWORD
      # as two textually-separate `REPLACE_WITH_RANDOM_SECRET` placeholders,
      # and generating a random secret "for each" (per that file's own
      # instructions) produced two DIFFERENT values — MinIO's actual root
      # password vs. what the backend tried to authenticate with — a
      # `SignatureDoesNotMatch`/403 the moment the media migration tried its
      # first upload. There is no separate non-root MinIO user anywhere in
      # this stack (see `minio-init` below: only `mc mb` + `mc anonymous
      # set download`, no `mc admin user add`), so the backend MUST use
      # MinIO's own root credentials — deriving both from the same
      # MINIO_ROOT_USER/MINIO_ROOT_PASSWORD (the same variables `minio` and
      # `minio-init` below already use) makes that structurally guaranteed
      # instead of something a human can accidentally diverge.
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-biawin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:4001:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api-staging.biawin.ir/api/v1}
    image: biawin-staging-web:latest
    container_name: biawin-staging-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - backend

  admin:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.admin
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-https://api-staging.biawin.ir/api/v1}
    image: biawin-staging-admin:latest
    container_name: biawin-staging-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - backend

volumes:
  biawin_staging_postgres_data:
    name: biawin_staging_postgres_data
  biawin_staging_redis_data:
    name: biawin_staging_redis_data
  biawin_staging_minio_data:
    name: biawin_staging_minio_data

networks:
  default:
    name: biawin-staging_default
    ipam:
      config:
        - subnet: 172.19.0.0/16
